<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1f1e">
<title>ترجملي — ترجمة ودبلجة الفيديو إلى العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1f1e;--panel:#132b29;--line:#24433f;--text:#f3efe4;--muted:#9db3ad;--gold:#f2b84b;--gold-d:#c9922c;--red:#ff8a78;--ok:#7fd8a6;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif;
padding:calc(20px + var(--safe-t)) 16px calc(32px + var(--safe-b));min-height:100vh}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
header{padding:12px 0 4px}
h1{font:600 clamp(2.6rem,12vw,3.6rem)/1.1 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;color:var(--gold);letter-spacing:0}
header p{color:var(--muted);margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.banner{border-radius:12px;padding:12px 14px;font-size:.95rem}
.banner.bad{background:#3a1f1c;border:1px solid #6b3a33;color:var(--red)}
.hidden{display:none!important}
.pick{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--gold-d);border-radius:14px;
padding:26px 14px;cursor:pointer;transition:background .15s}
.pick:hover,.pick:focus-within{background:#17342f}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick b{font-size:1.15rem;color:var(--gold)}
.pick small{color:var(--muted)}
.pick .name{color:var(--text);word-break:break-all}
label.f{display:grid;gap:6px;font-weight:500}
input[type=url],select{width:100%;background:#0e2423;color:var(--text);border:1px solid var(--line);border-radius:12px;
padding:12px 14px;font:inherit;min-height:48px}
input[type=url]{direction:ltr;text-align:left}
.hint{color:var(--muted);font-size:.88rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:13px 8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500;min-height:48px}
.seg input:checked+span{background:var(--gold);color:#241a05;border-color:var(--gold)}
.seg input:focus-visible+span,button:focus-visible,select:focus-visible,input[type=url]:focus-visible{outline:3px solid #fff8;outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--gold);height:32px}
button,.btn{font:600 1.05rem "IBM Plex Sans Arabic",sans-serif;border:0;border-radius:14px;min-height:54px;padding:0 18px;cursor:pointer;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.primary{background:var(--gold);color:#241a05}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.bar{height:12px;border-radius:99px;background:#0e2423;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--gold),var(--gold-d));transition:width .4s}
.stage{display:flex;justify-content:space-between;gap:8px}
.err{color:var(--red);background:#3a1f1c;border:1px solid #6b3a33;border-radius:12px;padding:12px 14px}
video{width:100%;max-height:70vh;border-radius:14px;background:#000}
.row{display:grid;gap:10px}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>ترجملي</h1>
  <p>ترجمة ودبلجة الفيديوهات إلى العربية: ارفع الفيديو واختر ترجمة مكتوبة أو صوتاً عربياً.</p>
</header>

<div id="banner" class="banner bad hidden"></div>

<form id="form" class="card" novalidate>
  <label class="pick" for="file">
    <b>اختر الفيديو</b>
    <span class="name" id="fname">اضغط لاختيار فيديو من هاتفك أو جهازك</span>
    <small id="limits"></small>
    <input id="file" type="file" accept="video/*">
  </label>

  <label class="f">لصق رابط إنستغرام
    <input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/...">
    <span class="hint">تنزيل روابط إنستغرام مباشرةً غير مدعوم لأنه غير موثوق وقد يُحظر. نزّل الفيديو على هاتفك ثم ارفعه من الأعلى.</span>
  </label>

  <div class="f" style="display:grid;gap:8px">
    <span style="font-weight:500">ترجمة إلى العربية</span>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="mode" value="subtitles" checked><span>ترجمة مكتوبة</span></label>
      <label><input type="radio" name="mode" value="dubbing"><span>دبلجة صوتية</span></label>
    </div>
  </div>

  <div id="dubOpts" class="hidden" style="display:grid;gap:14px">
    <label class="f">الصوت العربي
      <select id="voice">
        <option value="onyx">رجل — عميق (onyx)</option>
        <option value="echo">رجل — هادئ (echo)</option>
        <option value="ash">رجل — واضح (ash)</option>
        <option value="nova">امرأة — حيوي (nova)</option>
        <option value="shimmer">امرأة — ناعم (shimmer)</option>
        <option value="coral">امرأة — ودود (coral)</option>
      </select>
    </label>
    <label class="f">مستوى الصوت الأصلي: <span id="volv">15%</span>
      <input id="vol" type="range" min="0" max="100" step="5" value="15">
      <span class="hint">اسحب إلى 0% لكتم الصوت الأصلي تماماً.</span>
    </label>
  </div>

  <button id="go" class="primary" type="submit">ابدأ الترجمة</button>
</form>

<section id="progress" class="card hidden" aria-live="polite">
  <div class="stage"><b id="stage">جاري رفع الفيديو</b><span id="pct">0%</span></div>
  <div class="bar"><i id="fill"></i></div>
</section>

<div id="error" class="err hidden" role="alert"></div>

<section id="result" class="card hidden">
  <b style="color:var(--ok)">اكتملت الترجمة</b>
  <video id="player" controls playsinline preload="metadata"></video>
  <div class="row">
    <a id="dlVideo" class="btn primary" download>تحميل الفيديو</a>
    <a id="dlSrt" class="btn ghost" download>تحميل ملف الترجمة (SRT)</a>
  </div>
  <button id="again" class="ghost" type="button">ترجمة فيديو آخر</button>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const fileEl = $('file'), form = $('form');
let busy = false;

fetch('/api/health').then(r => r.json()).then(h => {
  $('limits').textContent = `الحد الأقصى ${h.max_mb} ميغابايت و${h.max_minutes} دقائق`;
  if (!h.api_key) showBanner('الخادم غير متصل بخدمة OpenAI: لم يتم ضبط مفتاح OPENAI_API_KEY، لذلك لن تعمل الترجمة حتى يُضبط.');
}).catch(() => showBanner('تعذّر الاتصال بالخادم. تأكد من تشغيل التطبيق ومن اتصالك بالإنترنت.'));

function showBanner(t){ $('banner').textContent = t; $('banner').classList.remove('hidden'); }
function showError(t){ $('error').textContent = t; $('error').classList.remove('hidden'); }
function clearError(){ $('error').classList.add('hidden'); }
function setProgress(p, msg){ $('fill').style.width = p + '%'; $('pct').textContent = p + '%'; if (msg) $('stage').textContent = msg; }
function setBusy(b){ busy = b; $('go').disabled = b; }

fileEl.addEventListener('change', () => {
  const f = fileEl.files[0];
  $('fname').textContent = f ? `${f.name} (${(f.size/1048576).toFixed(1)} ميغابايت)` : 'اضغط لاختيار فيديو من هاتفك أو جهازك';
  clearError();
});
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => {
  $('dubOpts').classList.toggle('hidden', document.querySelector('input[name=mode]:checked').value !== 'dubbing');
}));
$('vol').addEventListener('input', e => $('volv').textContent = e.target.value + '%');
$('again').addEventListener('click', () => {
  $('result').classList.add('hidden'); $('player').removeAttribute('src'); $('player').load();
  fileEl.value = ''; $('fname').textContent = 'اضغط لاختيار فيديو من هاتفك أو جهازك'; form.classList.remove('hidden');
  scrollTo({top: 0, behavior: 'smooth'});
});

form.addEventListener('submit', e => {
  e.preventDefault();
  if (busy) return;
  clearError();
  const f = fileEl.files[0];
  if (!f) {
    return showError($('url').value.trim()
      ? 'تنزيل روابط إنستغرام مباشرةً غير مدعوم. نزّل الفيديو على هاتفك ثم ارفعه من زر «اختر الفيديو».'
      : 'اختر ملف فيديو أولاً.');
  }
  if (f.type && !f.type.startsWith('video/')) return showError('نوع الملف غير مدعوم. اختر فيديو.');
  const fd = new FormData();
  fd.append('file', f);
  fd.append('mode', document.querySelector('input[name=mode]:checked').value);
  fd.append('voice', $('voice').value);
  fd.append('original_volume', ($('vol').value / 100).toString());

  setBusy(true);
  $('progress').classList.remove('hidden'); $('result').classList.add('hidden');
  setProgress(0, 'جاري رفع الفيديو');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/jobs');
  xhr.upload.onprogress = ev => { if (ev.lengthComputable) setProgress(Math.round(ev.loaded / ev.total * 5), 'جاري رفع الفيديو'); };
  xhr.onerror = () => fail('انقطع الاتصال أثناء الرفع. تحقق من الإنترنت وأعد المحاولة.');
  xhr.onload = () => {
    let d = {}; try { d = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status !== 200) return fail(d.error || 'تعذّر بدء المعالجة. أعد المحاولة.');
    poll(d.id);
  };
  xhr.send(fd);
});

function fail(msg){ setBusy(false); $('progress').classList.add('hidden'); showError(msg); }

async function poll(id){
  try {
    const r = await fetch('/api/jobs/' + id);
    const d = await r.json();
    if (!r.ok) return fail(d.error || 'فُقدت المهمة. أعد المحاولة.');
    if (d.status === 'error') return fail(d.message);
    setProgress(d.progress, d.message);
    if (d.status === 'done') return done(d);
  } catch (_) { /* انقطاع مؤقت: نعيد المحاولة */ }
  setTimeout(() => poll(id), 1500);
}

function done(d){
  setBusy(false);
  $('progress').classList.add('hidden');
  $('player').src = d.files.video;
  $('dlVideo').href = d.files.video + '?dl=1';
  $('dlSrt').href = d.files.srt + '?dl=1';
  $('result').classList.remove('hidden');
  $('result').scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
